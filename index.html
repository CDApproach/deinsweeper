<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="DeinSweeper – vier Logik-Varianten im Stil von Minesweeper. Jedes Feld ist garantiert ohne Raten lösbar.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeinSweeper">
  <title>DeinSweeper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- ============================== Startbildschirm -->
  <main id="home" class="screen active">
    <header class="home-head">
      <div class="logo" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span class="on"></span><span></span><span></span><span></span><span></span>
      </div>
      <div>
        <h1>DeinSweeper</h1>
        <p class="tagline">Logik statt Glück – jedes Feld ist lösbar.</p>
      </div>
      <div class="head-actions">
        <button class="icon-btn" id="btn-sound" aria-label="Ton an/aus"></button>
        <button class="icon-btn" id="btn-vibe" aria-label="Vibration an/aus"></button>
      </div>
    </header>

    <section>
      <h2 class="label">Variante</h2>
      <div class="modes" id="mode-list"></div>
    </section>

    <section>
      <h2 class="label">Schwierigkeit</h2>
      <div class="seg" id="diff-list" role="radiogroup"></div>
    </section>

    <section class="best-row">
      <div class="best" id="best-line"></div>
      <button class="link-btn" id="btn-scores">Bestenliste</button>
    </section>

    <div class="home-actions">
      <button class="btn primary big" id="btn-play">Spielen</button>
      <button class="btn ghost" id="btn-rules">Regeln</button>
    </div>
  </main>

  <!-- ============================== Spielbildschirm -->
  <main id="game" class="screen">
    <header class="game-head">
      <button class="icon-btn" id="btn-back" aria-label="Zurück zum Menü"></button>
      <div class="game-title">
        <span id="game-icon" class="mode-icon small"></span>
        <span id="game-name"></span>
        <span class="diff-chip" id="game-diff"></span>
      </div>
      <button class="icon-btn" id="btn-help" aria-label="Regeln"></button>
      <button class="icon-btn" id="btn-pause" aria-label="Pause"></button>
    </header>

    <div class="hud">
      <div class="stat"><span class="stat-label">Zeit</span><span class="stat-val" id="hud-time">0:00</span></div>
      <div class="stat score"><span class="stat-label">Punkte</span><span class="stat-val" id="hud-score">0</span></div>
      <div class="stat"><span class="stat-label" id="hud-mines-label">Minen</span><span class="stat-val" id="hud-mines">0</span></div>
      <div class="combo" id="hud-combo"><span id="hud-combo-text">x1</span><i id="hud-combo-bar"></i></div>
    </div>

    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Spielfeld"></div>
      <div class="board-msg" id="board-msg"></div>
    </div>

    <footer class="controls">
      <div class="tool-toggle" id="tool-toggle" role="radiogroup" aria-label="Werkzeug">
        <button data-tool="dig" class="active" role="radio" aria-checked="true"><span class="ti" id="ti-dig"></span>Aufdecken</button>
        <button data-tool="flag" role="radio" aria-checked="false"><span class="ti" id="ti-flag"></span><span id="flag-label">Markieren</span></button>
        <i class="tool-pill" aria-hidden="true"></i>
      </div>
      <button class="hint-btn" id="btn-hint" aria-label="Tipp anzeigen"><span class="ti" id="ti-hint"></span><span>Tipp</span></button>
    </footer>
    <footer class="controls end" id="end-controls">
      <button class="btn ghost" id="btn-result">Ergebnis</button>
      <button class="btn primary" id="btn-again">Nochmal</button>
    </footer>
  </main>

  <!-- ============================== Overlays -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
